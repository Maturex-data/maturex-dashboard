name: Microm Scheduled Pipeline (Provider -> Sheet -> DB)

on:
  schedule:
    # 09:00 ICT (UTC+7) -> 02:00 UTC (1 hour after EC)
    - cron: '0 2 * * *'
    # 13:00 ICT (UTC+7) -> 06:00 UTC (1 hour after EC)
    - cron: '0 6 * * *'
    # 22:00 ICT (UTC+7) -> 15:00 UTC (1 hour after EC)
    - cron: '0 15 * * *'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Manual trigger reason'
        required: false
        default: 'Manual test from GitHub Actions'

jobs:
  run-microm-pipeline:
    name: Run Microm Pipeline
    runs-on: ubuntu-latest
    steps:
      - name: Call Protected Microm Pipeline Endpoint
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ]; then
            echo "::error::APP_URL secret is not configured in GitHub Repository Secrets."
            exit 1
          fi

          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET secret is not configured in GitHub Repository Secrets."
            exit 1
          fi

          # Strip trailing slash if present
          CLEAN_URL="${APP_URL%/}"
          ENDPOINT="${CLEAN_URL}/api/cron/microm"

          echo "Triggering Microm Pipeline at: ${ENDPOINT}"
          echo "Trigger time (UTC): $(date -u)"

          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "${ENDPOINT}" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "Content-Type: application/json" \
            -H "User-Agent: GitHub-Actions-Scheduler")

          HTTP_BODY=$(echo "$RESPONSE" | sed '$d')
          HTTP_STATUS=$(echo "$RESPONSE" | tail -n 1)

          echo "HTTP Response Status: ${HTTP_STATUS}"
          echo "Response Body: ${HTTP_BODY}"

          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "::error::Microm pipeline endpoint returned HTTP ${HTTP_STATUS}"
            exit 1
          fi

          IS_SUCCESS=$(node -e 'try { const d = JSON.parse(process.argv[1]); console.log(d && d.success === true ? "true" : "false"); } catch { console.log("false"); }' "$HTTP_BODY")

          if [ "$IS_SUCCESS" != "true" ]; then
            echo "::error::Microm pipeline reported execution failure: ${HTTP_BODY}"
            exit 1
          fi

          echo "Microm Pipeline completed and verified successfully!"
