name: Microm Scheduled Pipeline (Provider -> Sheet -> DB)

on:
  schedule:
    # 09:00 ICT (UTC+7) -> 02:00 UTC (1 hour after EC)
    - cron: '0 2 * * *'
    # 13:00 ICT (UTC+7) -> 06:00 UTC (1 hour after EC)
    - cron: '0 6 * * *'
    # 22:00 ICT (UTC+7) -> 15:00 UTC (1 hour after EC)
    - cron: '0 15 * * *'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Manual trigger reason'
        required: false
        default: 'Manual test from GitHub Actions'

jobs:
  run-microm-pipeline:
    name: Run Microm Pipeline
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Upstream Sync (Provider -> Google Sheet)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
          GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          GOOGLE_DRIVE_REDIRECT_URI: ${{ secrets.GOOGLE_DRIVE_REDIRECT_URI }}
          GOOGLE_DRIVE_TOKEN_ENCRYPTION_KEY: ${{ secrets.GOOGLE_DRIVE_TOKEN_ENCRYPTION_KEY }}
          MICROM_SHOPIFY_STORE_DOMAIN: ${{ secrets.MICROM_SHOPIFY_STORE_DOMAIN }}
          MICROM_SHOPIFY_ACCESS_TOKEN: ${{ secrets.MICROM_SHOPIFY_ACCESS_TOKEN }}
          SHOPIFY_API_VERSION: ${{ secrets.SHOPIFY_API_VERSION }}
          MICROM_PGPRINT_SHOP_ID: ${{ secrets.MICROM_PGPRINT_SHOP_ID }}
          MICROM_PGPRINT_SECRET: ${{ secrets.MICROM_PGPRINT_SECRET }}
          MICROM_META_ACCESS_TOKEN: ${{ secrets.MICROM_META_ACCESS_TOKEN }}
          MICROM_META_AD_ACCOUNT_IDS: "1204086927598523,1734816417103349"
          MICROM_SPREADSHEET_ID: "15zckwx3zC-bY_AJsl19mFS1oRz7QkFL6NEW2huhxpuo"
        run: npm run sync:microm:upstream 14

      - name: Call Protected Microm Import Endpoint (Sheet -> DB)
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ]; then
            echo "::error::APP_URL secret is not configured in GitHub Repository Secrets."
            exit 1
          fi

          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET secret is not configured in GitHub Repository Secrets."
            exit 1
          fi

          # Strip trailing slash if present
          CLEAN_URL="${APP_URL%/}"
          ENDPOINT="${CLEAN_URL}/api/cron/microm?stage=sheet-to-db"

          echo "Triggering Microm Sheet-to-DB at: ${ENDPOINT}"
          echo "Trigger time (UTC): $(date -u)"

          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "${ENDPOINT}" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "Content-Type: application/json" \
            -H "User-Agent: GitHub-Actions-Scheduler")

          HTTP_BODY=$(echo "$RESPONSE" | sed '$d')
          HTTP_STATUS=$(echo "$RESPONSE" | tail -n 1)

          echo "HTTP Response Status: ${HTTP_STATUS}"
          echo "Response Body: ${HTTP_BODY}"

          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "::error::Microm pipeline endpoint returned HTTP ${HTTP_STATUS}"
            exit 1
          fi

          IS_SUCCESS=$(node -e 'try { const d = JSON.parse(process.argv[1]); console.log(d && d.success === true ? "true" : "false"); } catch { console.log("false"); }' "$HTTP_BODY")

          if [ "$IS_SUCCESS" != "true" ]; then
            echo "::error::Microm pipeline reported execution failure: ${HTTP_BODY}"
            exit 1
          fi

          echo "Microm Pipeline completed and verified successfully!"
