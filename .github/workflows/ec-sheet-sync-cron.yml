name: EC Sheet-to-DB Scheduled Sync

on:
  schedule:
    # 08:00 ICT (UTC+7) -> 01:00 UTC
    - cron: '0 1 * * *'
    # 12:00 ICT (UTC+7) -> 05:00 UTC
    - cron: '0 5 * * *'
    # 21:00 ICT (UTC+7) -> 14:00 UTC
    - cron: '0 14 * * *'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Manual trigger reason'
        required: false
        default: 'Manual test from GitHub Actions'

jobs:
  sync-ec-sheet:
    name: Trigger EC Sheet Sync
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Upstream Sync (Platform -> Sheet)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
          SHOPIFY_STORE_DOMAIN: ${{ secrets.SHOPIFY_STORE_DOMAIN }}
          SHOPIFY_ACCESS_TOKEN: ${{ secrets.SHOPIFY_ACCESS_TOKEN }}
          SHOPIFY_API_VERSION: ${{ secrets.SHOPIFY_API_VERSION }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_AD_ACCOUNT_ID: ${{ secrets.META_AD_ACCOUNT_ID }}
          GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          GOOGLE_DRIVE_REDIRECT_URI: ${{ secrets.GOOGLE_DRIVE_REDIRECT_URI }}
          GOOGLE_DRIVE_TOKEN_ENCRYPTION_KEY: ${{ secrets.GOOGLE_DRIVE_TOKEN_ENCRYPTION_KEY }}
          PGPRINT_SHOP_ID: ${{ secrets.PGPRINT_SHOP_ID }}
          PGPRINT_SECRET: ${{ secrets.PGPRINT_SECRET }}
          PRINTIFY_ACCESS_TOKEN: ${{ secrets.PRINTIFY_ACCESS_TOKEN }}
          PRINTIFY_SHOP_ID: ${{ secrets.PRINTIFY_SHOP_ID }}
          PRINTFUL_API_TOKEN: ${{ secrets.PRINTFUL_API_TOKEN }}
          LUXURY_PRO_SHEET_ID: ${{ secrets.LUXURY_PRO_SHEET_ID }}
          LUXURY_PRO_SHEET_GID: ${{ secrets.LUXURY_PRO_SHEET_GID }}
          EC_REPORT_SPREADSHEET_ID: ${{ secrets.EC_REPORT_SPREADSHEET_ID }}
        run: npm run sync:upstream 30

      - name: Call Protected EC Sheet Sync Cron Endpoint (Sheet -> DB)
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ]; then
            echo "::error::APP_URL secret is not configured in GitHub Repository Secrets."
            exit 1
          fi

          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET secret is not configured in GitHub Repository Secrets."
            exit 1
          fi

          # Strip trailing slash if present
          CLEAN_URL="${APP_URL%/}"
          ENDPOINT="${CLEAN_URL}/api/cron/ec-sheet-sync"

          echo "Triggering EC Sheet sync at: ${ENDPOINT}"
          echo "Trigger time (UTC): $(date -u)"

          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "${ENDPOINT}" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "Content-Type: application/json" \
            -H "User-Agent: GitHub-Actions-Scheduler")

          HTTP_BODY=$(echo "$RESPONSE" | sed '$d')
          HTTP_STATUS=$(echo "$RESPONSE" | tail -n 1)

          echo "HTTP Response Status: ${HTTP_STATUS}"
          echo "Response Body: ${HTTP_BODY}"

          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "::error::Sync endpoint returned HTTP ${HTTP_STATUS}"
            exit 1
          fi

          echo "EC Sheet Sync completed successfully!"
